name: Deploy Next.js to Namecheap

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ secrets.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build Next.js project
        run: npm run build

      - name: Export static site
        run: |
          echo "Setting output: export in next.config.mjs if not done"
          # This assumes you already added output: 'export' in next.config.mjs
          npm run build

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          port: ${{ secrets.SFTP_PORT }}
          privateKey: ${{ secrets.SFTP_PRIVATE_KEY }}
          local-dir: ./out
          server-dir: /public_html
          git-ftp-args: --insecure
